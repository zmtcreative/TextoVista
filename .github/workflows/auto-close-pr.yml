name: Auto-close Pull Requests

on:
  pull_request_target:
    types: [opened, reopened]

jobs:
  close-pr:
    # Replace 'username/public-repo' with your actual GitHub username and public repository name
    if: github.repository == 'zmtcreative/TextoVista'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write 

    steps:
      - name: Close PR and leave comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" --body "Thank you for your interest! However, this repository is a read-only mirror used purely for distribution and issue tracking. All development happens in a separate private repository. Because of this, we cannot accept pull requests here. This PR is being automatically closed."
          gh pr close "$PR_URL"